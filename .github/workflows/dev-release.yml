# Builds FreeMyTV and the embedded Home-redirect helper (extras/home-redirect/) from whatever's
# on main and republishes both under the same rolling "dev" release/tag on every push. Each is
# signed with its own dedicated CI key (FREEMYTV_KEYSTORE_B64/_PASS, TVHOME_KEYSTORE_B64/_PASS)
# so every dev build installs over the last one without having to uninstall first.
name: Dev release

on:
  push:
    branches: [main]

permissions:
  contents: write

# A new push replaces the in-flight build for the one before it; there's only ever one "dev" release.
concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  freemytv:
    name: Build FreeMyTV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (build-tools 34, android-34)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" \
            "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"

      - name: Decode the CI signing key
        run: echo "${{ secrets.FREEMYTV_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dev.keystore"

      - name: Build
        env:
          FREEMYTV_KEYSTORE: ${{ runner.temp }}/dev.keystore
          FREEMYTV_KEYSTORE_PASS: ${{ secrets.FREEMYTV_KEYSTORE_PASS }}
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: freemytv-apk
          path: FreeMyTV.apk

  home-redirect:
    name: Build Home-redirect helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (platform 34, build-tools 34)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" \
            "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
          echo "sdk.dir=$RUNNER_TEMP/sdk" > extras/home-redirect/local.properties

      - name: Decode the CI signing key
        run: echo "${{ secrets.TVHOME_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/tvhome.keystore"

      - name: Build
        working-directory: extras/home-redirect
        env:
          TVHOME_KEYSTORE: ${{ runner.temp }}/tvhome.keystore
          TVHOME_KEYSTORE_PASS: ${{ secrets.TVHOME_KEYSTORE_PASS }}
        run: |
          ./gradlew assembleDebug --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk HomeRedirect.apk

      - uses: actions/upload-artifact@v4
        with:
          name: home-redirect-apk
          path: extras/home-redirect/HomeRedirect.apk

  publish:
    name: Publish dev release
    needs: [freemytv, home-redirect]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: freemytv-apk
      - uses: actions/download-artifact@v4
        with:
          name: home-redirect-apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev build
          prerelease: true
          body: |
            Automatic build of ${{ github.sha }} on main. Always signed with the same CI keys, so
            each of these installs over its previous dev build (`adb install -r <file>.apk`)
            without uninstalling: FreeMyTV.apk (the home screen) and HomeRedirect.apk (the Home-
            button redirect helper, extras/home-redirect/).
          files: |
            FreeMyTV.apk
            HomeRedirect.apk
